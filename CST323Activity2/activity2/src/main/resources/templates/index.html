<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous">

    crossorigin="anonymous"></script>
</head>

<body>
    <div style="padding: 40px">
        <h1>Welcome to the Index Page</h1>
        <p>This is a simple HTML template.</p>
        <a href="/create" class="btn btn-primary">Create Product</a>
        <a href="/edit" class="btn btn-secondary">Edit Product</a>
        <a href="/delete" class="btn btn-danger">Delete Product</a>
    </div>

    <ol th:each="product : ${products}">
        <li>
            <span th:text="${product.id}">Product ID</span> -
            <span th:text="${product.name}">Product Name</span> - 
            <span th:text="${product.quantity}">Product Quantity</span> -
            <span th:text="${product.price}">Product Price</span>
    </ol>
</body>
</html>
