<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

</head>
<body>
    <h1>Edit Product</h1>
    <form th:action="@{/update}" th:object="${product}" method="put">
        <div style="padding: 30px">
            <label for="id">ID:</label>
            <input type="text" id="id" th:field="*{id}" required><br>

            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required><br>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" th:field="*{quantity}" required><br>

            <label for="price">Price:</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" required><br>
        </div>

        <div style="padding: 10px">
            <button type="submit">Update</button>
            <button type="button" onclick="window.location.href='/'">Cancel</button>
        </div>
    </form>
</body>
</html>
